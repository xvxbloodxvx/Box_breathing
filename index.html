<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Box Breath</title>
  <style>
    :root {
      --bg: #000000;
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --accent: #E5E5EA;
      --glow: rgba(255, 255, 255, 0.4);
      --card-bg: #1C1C1E;
      --btn-active: #3A3A3C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Screen Wrappers */
    .view {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 24px 20px;
    }

    .view.active {
      display: flex;
    }

    /* --- SETUP VIEW --- */
    .setup-header {
      text-align: center;
      margin-top: 20px;
    }

    .setup-header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .setup-header p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .setup-controls {
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 360px;
      width: 100%;
      margin: 0 auto;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-label {
      color: var(--text-muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Stepper */
    .stepper-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 6px;
    }

    .stepper-btn {
      background: #2C2C2E;
      color: #FFF;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
    }

    .stepper-btn:active {
      background: var(--btn-active);
    }

    .stepper-value {
      font-size: 20px;
      font-weight: 600;
    }

    /* Duration Toggle (One-Tap 30m / 60m) */
    .segmented-control {
      display: flex;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 4px;
    }

    .segmented-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segmented-btn.selected {
      background: #3A3A3C;
      color: #FFF;
    }

    /* Sound Switch */
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 14px 18px;
      border-radius: 14px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 30px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #3A3A3C;
      border-radius: 34px;
      transition: .3s;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: .3s;
    }

    input:checked + .slider {
      background-color: #34C759;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Buttons */
    .primary-btn {
      background: #FFFFFF;
      color: #000000;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: 600;
      padding: 18px;
      width: 100%;
      cursor: pointer;
    }

    .primary-btn:active {
      opacity: 0.85;
    }

    .secondary-btn {
      background: #2C2C2E;
      color: #FFF;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      width: 100%;
      cursor: pointer;
    }

    .secondary-btn:active {
      background: var(--btn-active);
    }

    /* --- SESSION VIEW --- */
    .session-top {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 40px;
    }

    .master-timer {
      font-size: 14px;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .master-timer.finishing {
      color: #FF9F0A;
      font-weight: 600;
    }

    /* Hybrid Box Container */
    .session-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .box-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.85);
      transition: transform 0.05s linear;
      will-change: transform;
    }

    .box-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .box-bg-border {
      fill: none;
      stroke: #2C2C2E;
      stroke-width: 4;
      rx: 24;
    }

    .box-progress-border {
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      rx: 24;
      stroke-dasharray: 880;
      stroke-dashoffset: 880;
      filter: drop-shadow(0 0 8px var(--glow));
    }

    .box-inner-text {
      position: relative;
      text-align: center;
      z-index: 2;
    }

    .phase-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .phase-countdown {
      font-size: 42px;
      font-weight: 300;
      color: var(--text-main);
    }

    .session-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Pause Overlay / Menu */
    .pause-controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Buffer Overlay */
    .buffer-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }

    .buffer-overlay.active {
      display: flex;
    }

    .buffer-label {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .buffer-countdown {
      font-size: 72px;
      font-weight: 200;
    }
  </style>
</head>
<body>

  <!-- Audio unlock bridge for iOS Silent Switch -->
  <audio id="silentAudio" loop playsinline src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA"></audio>

  <!-- 1. SETUP VIEW -->
  <div id="setupView" class="view active">
    <div class="setup-header">
      <h1>Box Breathing</h1>
      <p>Mindful balance & focus</p>
    </div>

    <div class="setup-controls">
      <!-- Step Duration Stepper -->
      <div class="control-group">
        <div class="control-label">Step Duration</div>
        <div class="stepper-container">
          <button class="stepper-btn" id="stepMinusBtn">-</button>
          <span class="stepper-value tabular" id="stepValue">5s</span>
          <button class="stepper-btn" id="stepPlusBtn">+</button>
        </div>
      </div>

      <!-- One-Tap Duration: 30m vs 60m -->
      <div class="control-group">
        <div class="control-label">Session Duration</div>
        <div class="segmented-control">
          <button class="segmented-btn selected" id="btn30m" data-mins="30">30 Min</button>
          <button class="segmented-btn" id="btn60m" data-mins="60">60 Min</button>
        </div>
      </div>

      <!-- Sound Toggle Switch -->
      <div class="switch-row">
        <span style="font-size: 16px; font-weight: 500;">Chimes</span>
        <label class="switch">
          <input type="checkbox" id="soundToggle" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button class="primary-btn" id="startBtn">Begin Exercise</button>
  </div>

  <!-- 2. ACTIVE SESSION VIEW -->
  <div id="sessionView" class="view">
    <!-- Top Master Timer -->
    <div class="session-top">
      <div class="master-timer tabular" id="masterTimer">30:00</div>
    </div>

    <!-- Center Hybrid Box -->
    <div class="session-center">
      <div class="box-wrapper" id="boxWrapper">
        <svg class="box-svg" viewBox="0 0 240 240">
          <!-- Background track -->
          <rect class="box-bg-border" x="10" y="10" width="220" height="220" />
          <!-- Perimeter trace stroke (perimeter length = 880) -->
          <rect class="box-progress-border" id="progressBorder" x="10" y="10" width="220" height="220" />
        </svg>

        <div class="box-inner-text">
          <div class="phase-title" id="phaseTitle">INHALE</div>
          <div class="phase-countdown tabular" id="phaseCountdown">5.0s</div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="session-bottom">
      <button class="secondary-btn" id="pauseBtn">Pause</button>
      
      <div class="pause-controls" id="pauseControls">
        <button class="primary-btn" id="resumeBtn">Resume</button>
        <button class="secondary-btn" id="endBtn" style="color: #FF453A;">End Session</button>
      </div>
    </div>
  </div>

  <!-- 3. PREPARATION BUFFER OVERLAY -->
  <div id="bufferOverlay" class="buffer-overlay">
    <div class="buffer-label">Get ready & empty your lungs</div>
    <div class="buffer-countdown tabular" id="bufferCountdown">3.0</div>
  </div>

  <script>
    /* =========================================================
       AUDIO ENGINE: Pure Web Audio Synthesizer (Zero Latency)
       ========================================================= */
    let audioCtx = null;
    const silentAudio = document.getElementById('silentAudio');

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      // Audio bridge to force iOS into media playback mode (bypasses silent switch)
      silentAudio.play().catch(() => {});
    }

    // Pure Sine Chimes: high for Inhale, mid for Hold, low for Exhale, deep for Hold 2
    function playChime(type) {
      if (!settings.soundEnabled || !audioCtx) return;
      initAudio();

      const freqs = {
        inhale: [528, 792],       // Rising / clear
        hold1: [440],             // Calming / stable
        exhale: [352, 264],       // Descending / grounding
        hold2: [220],             // Deep / still
        buffer: [440],            // Gentle prep tick
        complete: [528, 660, 792] // Resolving harmonic chord
      };

      const selectedFreqs = freqs[type] || [440];
      const now = audioCtx.currentTime;

      selectedFreqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.12, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + (type === 'complete' ? 3.5 : 1.2));

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + (type === 'complete' ? 3.6 : 1.3));
      });
    }

    /* =========================================================
       APPLICATION STATE & PERSISTENCE
       ========================================================= */
    const settings = {
      stepDuration: parseInt(localStorage.getItem('bb_step') || '5', 10),
      sessionMinutes: parseInt(localStorage.getItem('bb_mins') || '30', 10),
      soundEnabled: localStorage.getItem('bb_sound') !== 'false'
    };

    function saveSettings() {
      localStorage.setItem('bb_step', settings.stepDuration);
      localStorage.setItem('bb_mins', settings.sessionMinutes);
      localStorage.setItem('bb_sound', settings.soundEnabled);
    }

    /* DOM Elements */
    const setupView = document.getElementById('setupView');
    const sessionView = document.getElementById('sessionView');
    const bufferOverlay = document.getElementById('bufferOverlay');
    const bufferCountdown = document.getElementById('bufferCountdown');

    const stepValueEl = document.getElementById('stepValue');
    const stepMinusBtn = document.getElementById('stepMinusBtn');
    const stepPlusBtn = document.getElementById('stepPlusBtn');
    const btn30m = document.getElementById('btn30m');
    const btn60m = document.getElementById('btn60m');
    const soundToggle = document.getElementById('soundToggle');
    const startBtn = document.getElementById('startBtn');

    const masterTimerEl = document.getElementById('masterTimer');
    const phaseTitleEl = document.getElementById('phaseTitle');
    const phaseCountdownEl = document.getElementById('phaseCountdown');
    const boxWrapper = document.getElementById('boxWrapper');
    const progressBorder = document.getElementById('progressBorder');

    const pauseBtn = document.getElementById('pauseBtn');
    const pauseControls = document.getElementById('pauseControls');
    const resumeBtn = document.getElementById('resumeBtn');
    const endBtn = document.getElementById('endBtn');

    /* Setup UI Sync */
    function syncSetupUI() {
      stepValueEl.textContent = `${settings.stepDuration}s`;
      btn30m.classList.toggle('selected', settings.sessionMinutes === 30);
      btn60m.classList.toggle('selected', settings.sessionMinutes === 60);
      soundToggle.checked = settings.soundEnabled;
    }
    syncSetupUI();

    stepMinusBtn.onclick = () => {
      if (settings.stepDuration > 2) {
        settings.stepDuration--;
        syncSetupUI();
        saveSettings();
      }
    };
    stepPlusBtn.onclick = () => {
      if (settings.stepDuration < 30) {
        settings.stepDuration++;
        syncSetupUI();
        saveSettings();
      }
    };
    btn30m.onclick = () => { settings.sessionMinutes = 30; syncSetupUI(); saveSettings(); };
    btn60m.onclick = () => { settings.sessionMinutes = 60; syncSetupUI(); saveSettings(); };
    soundToggle.onchange = (e) => { settings.soundEnabled = e.target.checked; saveSettings(); };

    /* =========================================================
       SCREEN WAKE LOCK (Prevents iOS Dimming)
       ========================================================= */
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }
    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    /* Auto-Pause on Background / Phone Call */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && currentSessionState === 'RUNNING') {
        pauseSession();
      }
    });

    /* =========================================================
       TIMING ENGINE & STATE MACHINE
       ========================================================= */
    const PERIMETER = 880; // SVG border total stroke length
    const PHASES = ['inhale', 'hold1', 'exhale', 'hold2'];
    const PHASE_NAMES = ['INHALE', 'HOLD', 'EXHALE', 'HOLD'];

    let currentSessionState = 'IDLE'; // IDLE, BUFFER, RUNNING, PAUSED
    let phaseIndex = 0;
    let phaseStartTime = 0;
    let masterRemainingMs = 0;
    let isFinishingFinalCycle = false;
    let rAFId = null;

    /* Start Session */
    startBtn.onclick = () => {
      initAudio();
      requestWakeLock();
      setupView.classList.remove('active');
      sessionView.classList.add('active');
      
      masterRemainingMs = settings.sessionMinutes * 60 * 1000;
      isFinishingFinalCycle = false;
      masterTimerEl.classList.remove('finishing');

      runBufferCountdown(() => {
        phaseIndex = 0;
        startPhase(0);
      });
    };

    /* 3-Second Lead-in Buffer */
    function runBufferCountdown(callback) {
      currentSessionState = 'BUFFER';
      bufferOverlay.classList.add('active');
      let bufferRemaining = 3.0;
      bufferCountdown.textContent = bufferRemaining.toFixed(1);
      playChime('buffer');

      const start = performance.now();
      function tick(now) {
        const elapsed = (now - start) / 1000;
        const remaining = Math.max(0, 3.0 - elapsed);
        bufferCountdown.textContent = remaining.toFixed(1);

        if (remaining > 0) {
          rAFId = requestAnimationFrame(tick);
        } else {
          bufferOverlay.classList.remove('active');
          callback();
        }
      }
      rAFId = requestAnimationFrame(tick);
    }

    /* Start Phase */
    function startPhase(index) {
      currentSessionState = 'RUNNING';
      phaseIndex = index;
      phaseStartTime = performance.now();
      phaseTitleEl.textContent = PHASE_NAMES[phaseIndex];
      playChime(PHASES[phaseIndex]);

      if (rAFId) cancelAnimationFrame(rAFId);
      rAFId = requestAnimationFrame(loop);
    }

    /* Main Frame Loop (60/120fps with performance.now delta) */
    function loop(now) {
      if (currentSessionState !== 'RUNNING') return;

      const phaseDurationMs = settings.stepDuration * 1000;
      const elapsedPhase = now - phaseStartTime;
      const progress = Math.min(1, elapsedPhase / phaseDurationMs);

      // Render tenths countdown (e.g., 5.0s -> 0.0s)
      const remainingSec = Math.max(0, (phaseDurationMs - elapsedPhase) / 1000);
      phaseCountdownEl.textContent = remainingSec.toFixed(1) + 's';

      // Update Master Countdown
      if (!isFinishingFinalCycle) {
        masterRemainingMs -= 16.6;
        if (masterRemainingMs <= 0) {
          isFinishingFinalCycle = true;
          masterTimerEl.textContent = "Completing Final Cycle";
          masterTimerEl.classList.add('finishing');
        } else {
          const totalSecs = Math.ceil(masterRemainingMs / 1000);
          const mins = Math.floor(totalSecs / 60);
          const secs = totalSecs % 60;
          masterTimerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }
      }

      /* HYBRID ANIMATION MATH:
         Scale: 0.85 (empty) to 1.15 (full)
         Perimeter Trace: Quarter-segment for each phase
      */
      let scale = 0.85;
      let offset = PERIMETER;
      const quarter = PERIMETER / 4; // 220px per side

      if (phaseIndex === 0) {
        // INHALE: scale up, draw top edge (0 -> 220)
        scale = 0.85 + (0.30 * progress);
        offset = PERIMETER - (progress * quarter);
      } else if (phaseIndex === 1) {
        // HOLD 1: hold expanded size, draw right edge (220 -> 440)
        scale = 1.15;
        offset = PERIMETER - quarter - (progress * quarter);
      } else if (phaseIndex === 2) {
        // EXHALE: scale down, draw bottom edge (440 -> 660)
        scale = 1.15 - (0.30 * progress);
        offset = PERIMETER - (quarter * 2) - (progress * quarter);
      } else if (phaseIndex === 3) {
        // HOLD 2: hold compact size, draw left edge (660 -> 880)
        scale = 0.85;
        offset = PERIMETER - (quarter * 3) - (progress * quarter);
      }

      boxWrapper.style.transform = `scale(${scale})`;
      progressBorder.style.strokeDashoffset = offset;

      // Phase Transition
      if (progress >= 1) {
        if (phaseIndex === 3 && isFinishingFinalCycle) {
          finishSession();
          return;
        }
        startPhase((phaseIndex + 1) % 4);
      } else {
        rAFId = requestAnimationFrame(loop);
      }
    }

    /* Pause / Resume Logic (Rule 1: Clean Re-Entry) */
    function pauseSession() {
      if (currentSessionState !== 'RUNNING' && currentSessionState !== 'BUFFER') return;
      currentSessionState = 'PAUSED';
      if (rAFId) cancelAnimationFrame(rAFId);
      releaseWakeLock();

      pauseBtn.style.display = 'none';
      pauseControls.style.display = 'flex';
      bufferOverlay.classList.remove('active');
    }

    pauseBtn.onclick = pauseSession;

    resumeBtn.onclick = () => {
      initAudio();
      requestWakeLock();
      pauseControls.style.display = 'none';
      pauseBtn.style.display = 'block';

      // Rule 1: Always cleanly restart at Step 1 (Inhale) through the 3-second buffer
      runBufferCountdown(() => {
        phaseIndex = 0;
        startPhase(0);
      });
    };

    endBtn.onclick = () => {
      if (rAFId) cancelAnimationFrame(rAFId);
      releaseWakeLock();
      currentSessionState = 'IDLE';

      pauseControls.style.display = 'none';
      pauseBtn.style.display = 'block';
      sessionView.classList.remove('active');
      setupView.classList.add('active');
    };

    /* Graceful Completion */
    function finishSession() {
      if (rAFId) cancelAnimationFrame(rAFId);
      releaseWakeLock();
      currentSessionState = 'IDLE';
      playChime('complete');

      phaseTitleEl.textContent = "COMPLETE";
      phaseCountdownEl.textContent = "✓";
      boxWrapper.style.transform = "scale(1.0)";
      progressBorder.style.strokeDashoffset = 0;

      setTimeout(() => {
        sessionView.classList.remove('active');
        setupView.classList.add('active');
      }, 3500);
    }
  </script>
</body>
</html>
